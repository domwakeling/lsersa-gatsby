-   name: Precise Racing
    url: http://preciseracing.co.uk/
    img: sponsors/precise.png
    target: _precise
    type: partner
    copy: >
        <p>Precise Racing offer an elite snow-training programme carefully planned for enthusiastic
        young skiers. They also run open training camps across the UK and the Kent and Surrey school
        ski championships.</p>

-   name: Ski Shack
    url: https://skishack.co.uk/
    img: sponsors/skishack.png
    target: _skishack
    type: partner
    copy: >
        <p>The Ski Shack is a friendly family-run business supplying clothing, equipment and
        servicing for skiing and snowboarding, with a passion for snow sports and fantastic quality
        products at great prices.</p>

