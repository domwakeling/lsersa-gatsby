-   name: Maison Sport
    url: https://maisonsport.com/
    img: sponsors/maisonsport.png
    target: _maisonsport
    type: partner
    copy: >
        <p>Maison Sport is the industry leading booking platform for ski and snowboard lessons. The
        founding team are ex-British ski team members, with private and group lessons across more
        than 420 European resorts.</p>

-   name: Fidelity Integrated Systems
    url: http://www.fidelityintegrated.com/
    img: sponsors/fidelity.png
    target: _fidelity
    type: partner
    copy: >
        <p>Fidelity Integrated Systems specialises in designing and installing high quality, fully
            integrated security and fire systems for businesses and large residential estates using
            the latest technology from industry leading manufacturers.</p>

-   name: Ski Bartlett
    url: https://www.skibartlett.com/
    img: sponsors/bartlett.png
    target: _bartlett
    type: supporter
    copy: >
        <p>Established in 1965, Ski Bartlett is one of the UK's most popular independent specialist
          ski shops. We stock one of the largest ranges of skis, boots, clothing and equipment
          available in the UK and cater for every ability level, age and style of skier.</p>
        <p>Whether your passion is racing, freestyle, freeride, touring, telemark or recreational
          skiing, we can custom fit you with a boot to suit your style. Find out more by visiting
          <a href="https://www.skibartlett.com/" target="_bartlett">our website</a>.</p>

